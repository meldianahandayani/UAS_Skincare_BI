x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    # --- The following env vars are required for all executors ---
    # These are connection strings for the Airflow metadata database and the result backend.
    # The format is: <db_type>+<driver>://<user>:<password>@<host>:<port>/<db_name>
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
    # --- The following env vars are required for CeleryExecutor ---
    # This is the connection string for the Celery message broker (Redis).
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
    # --- The following env vars are general Airflow configurations ---
    # A key for encrypting connections and other sensitive data.
    # PLEASE REPLACE THIS WITH A PROPERLY GENERATED KEY, e.g., from `openssl rand -hex 30`
    AIRFLOW__CORE__FERNET_KEY: 'FB4s2QY3nQ8gY3R9mJ5pL3T9q9g8wE7dD6g3vVb4rXk='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # --- The following env vars are for the Airflow API and UI ---
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # --- The following env vars are for initial setup ---
    _AIRFLOW_DB_UPGRADE: 'true'
    _AIRFLOW_WWW_USER_CREATE: 'true'
    _AIRFLOW_WWW_USER_USERNAME: airflow
    _AIRFLOW_WWW_USER_PASSWORD: airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./datalake:/opt/airflow/datalake
    - ./journal_history.csv:/opt/airflow/journal_history.csv
    - ./.env:/opt/airflow/.env
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
  depends_on:
    airflow-postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

version: "3.8"
services:
  # Your Application's Database (renamed to avoid conflict)
  app-postgres:
    image: postgres:15
    container_name: skincare_postgres_app
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: skincare_db
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "skincare_db"]
      interval: 10s
      timeout: 30s
      retries: 3

  # --- Airflow Setup ---
  redis:
    image: redis:7.0
    container_name: airflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 3
    ports:
      - "6379:6379" # Optional: can be removed if you don't need to access Redis from host

  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres-meta
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 10s
      timeout: 30s
      retries: 3
    volumes:
      - airflow-pg_data:/var/lib/postgresql/data

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test:
        - "CMD-SHELL"
        - "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: worker

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Initialize the database and create the admin user
        airflow db init
        airflow users create \
          --role Admin \
          --username airflow \
          --password airflow \
          --firstname Anonymous \
          --lastname Admin \
          --email admin@example.org
    depends_on:
      airflow-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  airflow-pg_data:
  airflow-logs:
  airflow-plugins:
